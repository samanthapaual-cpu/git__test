<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
</head>
<body>
    <!-- Working with Text -->
    <!-- <p> is for paragraph -->
    <!-- <em> is for Italic font -->
    <!-- <strong> is for bold font -->
    <!-- As you can see, we have indention per line, we call it nesting elements. We do this for readability, as well as for 
     parent-child relationship -->
     <h1>This is me Samsam h1</h1>
     <h2>This is me Samsam for h2</h2>
     <h2>This is me Samsam for h3</h2>
    <p><strong><em>Samantha Paual</em></strong></p>
</body>
</html>
